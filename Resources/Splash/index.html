<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<script src="./engine-core.js"></script>
<script>
var params = new URLSearchParams(location.search);
var state = STATE_TO_MODE[params.get('state')] ? params.get('state') : 'working';
var size = 64;
var dark = params.get('dark') !== '0';

var canvas = document.getElementById('orb');
var dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = Math.round(size * dpr);
canvas.height = Math.round(size * dpr);
canvas.style.width = size + 'px';
canvas.style.height = size + 'px';
var ctx = canvas.getContext('2d');

var resolved = resolvePreset(state, size);
var draw = MODE_DRAWS[resolved.mode];

function loop() {
  var t = (performance.now() / 1000) * resolved.speed;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  draw(ctx, size, t, dark, resolved.opts);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
